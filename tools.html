<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Расчёт окупаемости — IdeaNest</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/icon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#22c55e" />
  <meta name="description" content="Быстрый расчёт окупаемости бизнеса: вложения, прибыль в месяц, срок возврата." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shell.css" />
  
<script>(function(){try{
  var modePref=localStorage.getItem('ideanest-theme');
  var t=null;
  try{t=JSON.parse(localStorage.getItem('ideanest_theme')||'null');}catch(e){}
  var GREEN={
    'accent-primary':'#1a9f4b','accent-hover':'#15803d','accent-light':'#e8f8ef',
    'bg-color':'#f3f6f5','bg-muted':'#e8eeeb','surface-color':'#ffffff',
    'text-main':'#0c1411','text-muted':'#5a6f66','border-color':'#d5e0db'
  };
  var DARK={
    'accent-primary':'#1a9f4b','accent-hover':'#22c55e','accent-light':'#143528',
    'bg-color':'#0c1411','bg-muted':'#101a16','surface-color':'#15201b',
    'text-main':'#e8f0ec','text-muted':'#8aa399','border-color':'rgba(255,255,255,0.1)'
  };
  // resolve mode: explicit toggle wins
  var mode=modePref;
  if(mode!=='light'&&mode!=='dark'){
    if(t&&(t.key==='dark'||t.key==='neon')) mode='dark';
    else mode='light';
  }
  try{localStorage.setItem('ideanest-theme',mode);}catch(e){}
  if(mode==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');

  // base palette for mode (never apply dark bg colors in light mode)
  var base=mode==='dark'?DARK:GREEN;
  var colors=Object.assign({},base);
  if(t&&t.colors){
    // only keep custom accent if not legacy orange
    var ap=(t.colors['accent-primary']||'').toLowerCase();
    var isOrange=!ap||/#f59e0b|#d97706|#fffbeb|#ea580c|#f97316|#fb923c|#ca8a04|#eab308|#fbbf24/.test(ap)||ap.indexOf('f59')>=0;
    if(!isOrange&&ap){
      colors['accent-primary']=t.colors['accent-primary'];
      colors['accent-hover']=t.colors['accent-hover']||colors['accent-hover'];
      colors['accent-light']=t.colors['accent-light']||colors['accent-light'];
    }
  }
  var r=document.documentElement.style;
  Object.keys(colors).forEach(function(k){r.setProperty('--'+k,colors[k]);});
  r.setProperty('--accent',colors['accent-primary']);
  r.setProperty('--accent-primary',colors['accent-primary']);
  r.setProperty('--accent-hover',colors['accent-hover']);
  r.setProperty('--accent-light',colors['accent-light']);
  // persist cleaned theme
  try{
    localStorage.setItem('ideanest_theme',JSON.stringify({key:mode,colors:colors}));
  }catch(e){}
}catch(e){}})();</script>
</head>
<body class="shell-body shell-site">
  <main class="page shell-page shell-centered-page">
    <div class="shell-tools-inner">
    <h1 class="page-h" style="margin-top:28px">Окупаемость</h1>
    <p class="page-lead">Ориентир по цифрам. В статьях — расширенные калькуляторы.</p>
    <div class="card-soft calc shell-center-card">
      <label class="field">Вложения, ₽
        <input type="number" id="inv" value="300000" step="10000" />
      </label>
      <label class="field">Прибыль в месяц, ₽
        <input type="number" id="profit" value="45000" step="1000" />
      </label>
      <div class="calc-metrics">
        <div><span>Окупаемость</span><strong id="mMonths">—</strong></div>
        <div><span>За год</span><strong id="mYear">—</strong></div>
        <div><span>Доходность</span><strong id="mRoi">—</strong></div>
      </div>
    </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shell-chrome.js"></script>
  <script>
    function upd() {
      var inv = Number(document.getElementById('inv').value) || 0;
      var p = Number(document.getElementById('profit').value) || 0;
      document.getElementById('mYear').textContent = (p * 12).toLocaleString('ru-RU') + ' ₽';
      if (p <= 0) {
        document.getElementById('mMonths').textContent = '—';
        document.getElementById('mRoi').textContent = '—';
        return;
      }
      var m = inv / p;
      document.getElementById('mMonths').textContent = m < 0.2 ? 'сразу' : m.toFixed(1).replace('.0', '') + ' мес.';
      document.getElementById('mRoi').textContent = inv > 0 ? Math.round((p * 12) / inv * 100) + '% / год' : '—';
    }
    document.getElementById('inv').oninput = upd;
    document.getElementById('profit').oninput = upd;
    upd();
  </script>
</body>
</html>
