<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль — IdeaNest</title>
  <link rel="icon" href="../assets/logo-dark.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script>(function(){try{var t=JSON.parse(localStorage.getItem("ideanest_theme")||"null");if(t&&t.colors){var r=document.documentElement.style;Object.keys(t.colors).forEach(function(k){r.setProperty("--"+k,t.colors[k]);});var key=t.key||"light",mode=key;if(key==="dark")mode="dark";else if(key==="light"||key==="colorful")mode=key;else{var bg=(t.colors["bg-color"]||"#ffffff").replace("#","");if(bg.length===3)bg=bg[0]+bg[0]+bg[1]+bg[1]+bg[2]+bg[2];var n=parseInt(bg,16);if(!isNaN(n)){var R=(n>>16)&255,G=(n>>8)&255,B=n&255;mode=(0.299*R+0.587*G+0.114*B)<140?"dark":"light";}}document.documentElement.setAttribute("data-theme",mode);}}catch(e){}})();</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="profile-blur-overlay" id="profileBlurOverlay"></div>
  <header class="navbar">
    <div class="navbar-container">
      <a class="brand" href="../index.html">
        <img src="../assets/logo-dark.png" class="brand-logo" alt="IdeaNest" /> IdeaNest
      </a>
      <nav class="nav-links">
        <a href="../ideas/all.html" class="nav-link">Идеи</a>
        <a href="../articles/index.html" class="nav-link">Статьи</a>
      </nav>
      <div class="navbar-actions">
        <button class="btn btn-secondary" id="loginBtn" style="display:none;">Войти</button>
        <div class="profile-wrapper" id="profileWrapper" style="display:none;">
          <img src="" id="topAvatar" class="avatar-img" alt="Профиль">
          <div class="profile-dropdown" id="profileDropdown">
            <div class="dropdown-header">
              <img src="" id="dropdownAvatar" class="dropdown-avatar" alt="">
              <div class="user-info">
                <span class="user-name" id="userName">Пользователь</span>
                <span class="user-email" id="userEmail"></span>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <a href="#" class="dropdown-item" id="profilePageLink"><i data-lucide="user"></i> Профиль</a>
            <a href="../settings/settings.html" class="dropdown-item"><i data-lucide="settings"></i> Настройки</a>
            <div class="dropdown-divider"></div>
            <button type="button" class="dropdown-item" id="hubContentBtn"><i data-lucide="layout-grid"></i> Мой контент</button>
            <button type="button" class="dropdown-item" id="hubAccountBtn"><i data-lucide="shield"></i> Аккаунт</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="section" style="padding-top:32px;max-width:900px;margin:0 auto;">
    <div id="publicProfileMount"></div>
  </main>
  <div id="toastContainer" class="toast-container"></div>
  <script src="../script.js"></script>
</body>
</html>
