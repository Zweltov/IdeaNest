<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Профиль — IdeaNest</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../shell.css" />
  <script>
    try {
      var t = localStorage.getItem('ideanest-theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  </script>
</head>
<body class="shell-body shell-site">
  <main class="detail-main detail-main--settings" style="padding-top:48px;">
    <p class="muted" style="color:var(--text-muted);">Загрузка профиля…</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../script.js"></script>
  <script src="../shell-chrome.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      function open() {
        if (typeof window.openProfileWindow === 'function') {
          window.openProfileWindow();
          return true;
        }
        return false;
      }
      if (!open()) {
        setTimeout(function () {
          if (!open()) {
            var m = document.querySelector('main');
            if (m) m.innerHTML = '<p>Не удалось открыть профиль. <a href="../index.html">На главную</a></p>';
          }
        }, 400);
      }
    });
  </script>
</body>
</html>
