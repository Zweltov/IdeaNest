<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="../assets/icon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />
  <meta name="theme-color" content="#F59E0B" />
  <title>Статьи о бизнесе — IdeaNest</title>
  <meta name="description" content="Экспертные статьи о запуске и развитии бизнеса: разборы, расчёты и практические гайды." />
  <link rel="canonical" href="https://ideanest.ru/articles/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="IdeaNest" />
  <meta property="og:locale" content="ru_RU" />
  <meta property="og:title" content="Статьи о бизнесе — IdeaNest" />
  <meta property="og:description" content="Экспертные статьи о запуске и развитии бизнеса: разборы, расчёты и практические гайды." />
  <meta property="og:url" content="https://ideanest.ru/articles/" />
  <meta property="og:image" content="https://ideanest.ru/assets/logo-dark.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Статьи о бизнесе — IdeaNest" />
  <meta name="twitter:description" content="Экспертные статьи о запуске и развитии бизнеса: разборы, расчёты и практические гайды." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script>(function(){try{var t=JSON.parse(localStorage.getItem("ideanest_theme")||"null");if(!t||!t.colors)return;var r=document.documentElement.style,key=t.key||"light";Object.keys(t.colors).forEach(function(k){r.setProperty("--"+k,t.colors[k]);});if(t.colors["accent-primary"])r.setProperty("--accent",t.colors["accent-primary"]);var skins={ink:1,clay:1,neon:1};var mode="light";if(key==="dark"||key==="neon")mode="dark";else if(key==="colorful")mode="colorful";else if(skins[key])mode="light";else{var bg=(t.colors["bg-color"]||"#fff").replace("#","");if(bg.length===3)bg=bg[0]+bg[0]+bg[1]+bg[1]+bg[2]+bg[2];var n=parseInt(bg,16);if(!isNaN(n)){var R=(n>>16)&255,G=(n>>8)&255,B=n&255;mode=(0.299*R+0.587*G+0.114*B)<140?"dark":"light";}}document.documentElement.setAttribute("data-theme",mode);if(skins[key]){document.documentElement.setAttribute("data-skin",key);var hrefs={ink:"https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap",clay:"https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap",neon:"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"};if(hrefs[key]){var l=document.createElement("link");l.rel="stylesheet";l.href=hrefs[key];l.id="ideanest-skin-fonts";document.head.appendChild(l);}}else{document.documentElement.removeAttribute("data-skin");}}catch(e){}})();</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="profile-blur-overlay" id="profileBlurOverlay"></div>

  <header class="navbar">
    <div class="navbar-container">
      <a class="brand" href="../index.html">
        <img src="../assets/logo-dark.png" class="brand-logo" alt="IdeaNest" /> IdeaNest
      </a>

      <nav class="nav-links">
        <a href="../ideas/all.html" class="nav-link">Идеи</a>
        <a href="index.html" class="nav-link">Статьи</a>
      </nav>

      <div class="navbar-actions">
        <button class="btn btn-secondary" id="loginBtn" style="display:none;">Войти</button>
        <div class="profile-wrapper" id="profileWrapper" style="display:none;">
          <img src="https://ui-avatars.com/api/?name=User&background=000&color=fff" id="topAvatar" class="avatar-img" alt="Профиль">

          <div class="profile-dropdown" id="profileDropdown">
            <div class="dropdown-header">
              <img src="https://ui-avatars.com/api/?name=User&background=000&color=fff" id="dropdownAvatar" class="dropdown-avatar" alt="Профиль">
              <div class="user-info">
                <span class="user-name" id="userName">Пользователь</span>
                <span class="user-email" id="userEmail">user@ideanest.com</span>
              </div>
            </div>
            <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item" id="profilePageLink"><i data-lucide="user"></i> Профиль</a>
            <a href="settings/settings.html" class="dropdown-item"><i data-lucide="settings"></i> Настройки</a>
            <div class="dropdown-divider"></div>
            <button type="button" class="dropdown-item" id="hubContentBtn"><i data-lucide="layout-grid"></i> Мой контент</button>
            <button type="button" class="dropdown-item" id="hubAccountBtn"><i data-lucide="shield"></i> Аккаунт</button>
</div>
        </div>
      </div>
    </div>
  </header>

  <main class="detail-main detail-main--wide">
    <a href="../index.html#articles" class="btn-text" style="margin-bottom: 24px; display: inline-flex;">
      <i data-lucide="arrow-left"></i> На главную
    </a>
    <h1 class="section-title" style="margin-bottom: 32px;">Все статьи</h1>

    <div class="filters-container">
      <div class="ideas-search-wrap" style="flex: 1; min-width: 220px; max-width: 360px;">
        <i data-lucide="search"></i>
        <input type="text" id="articleSearchInput" placeholder="Искать по статьям..." />
      </div>

      <div class="filters-actions">
        <div class="sort-dropdown" id="articleIdeaFilterDropdown">
          <button type="button" class="sort-dropdown-btn" id="articleIdeaFilterBtn" title="Фильтр по идее">
            <i data-lucide="lightbulb"></i>
            <span class="sort-btn-label" id="articleIdeaFilterLabel">Идея</span>
            <i data-lucide="chevron-down" class="sort-chevron"></i>
          </button>
          <div class="sort-dropdown-menu" id="articleIdeaFilterMenu">
            <p class="sort-dropdown-empty">Загрузка…</p>
          </div>
        </div>

        <div class="sort-dropdown" id="articleSortDropdown">
          <button type="button" class="sort-dropdown-btn" id="articleSortBtn" title="Сортировка">
            <i data-lucide="arrow-up-down" class="sort-icon-only"></i>
            <span class="sort-btn-label" id="articleSortBtnLabel">Сначала новые</span>
            <i data-lucide="chevron-down" class="sort-chevron"></i>
          </button>
          <div class="sort-dropdown-menu" id="articleSortMenu">
            <button type="button" class="sort-dropdown-item active" data-sort="new">Сначала новые</button>
            <button type="button" class="sort-dropdown-item" data-sort="old">Сначала старые</button>
            <button type="button" class="sort-dropdown-item" data-sort="popular">По популярности</button>
            <button type="button" class="sort-dropdown-item" data-sort="az">По алфавиту (А → Я)</button>
            <button type="button" class="sort-dropdown-item" data-sort="za">По алфавиту (Я → А)</button>
          </div>
        </div>
      </div>
    </div>

    <div id="articleIdeaFilterChip" class="filter-chip-row" style="display:none;"></div>

    <div class="grid-cards articles-grid" id="articlesPageGrid">
      <p style="color: var(--text-muted);">Загрузка статей...</p>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <div class="modal-backdrop" id="articleBackdrop">
    <div class="modal idea-modal">
      <button class="modal-close" id="articleCloseBtn" aria-label="Закрыть"><i data-lucide="x"></i></button>
      <div id="articleModalBody"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="ideaBackdrop">
    <div class="modal idea-modal">
      <button class="modal-close" id="ideaCloseBtn" aria-label="Закрыть"><i data-lucide="x"></i></button>
      <div id="ideaModalBody"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="authBackdrop">
    <div class="modal auth-modal">
      <button class="modal-close" id="authCloseBtn" aria-label="Закрыть"><i data-lucide="x"></i></button>
      <div class="auth-tabs" id="authTabs">
        <button class="auth-tab active" data-auth-tab="signin">Вход</button>
        <button class="auth-tab" data-auth-tab="signup">Регистрация</button>
      </div>
      <button type="button" class="auth-reset-back" id="authResetBack" style="display:none;">
        <i data-lucide="arrow-left"></i> Назад ко входу
      </button>
      <form id="authForm">
        <div class="form-group nickname-group" id="usernameGroup">
          <label for="authFullName">Имя</label>
          <input type="text" id="authFullName" placeholder="Александр" autocomplete="name" style="margin-bottom:14px;" />

          <label for="authUsername">Никнейм</label>
          <div class="nickname-input-wrapper">
            <span class="nickname-at">@</span>
            <input type="text" id="authUsername" placeholder="nickname" autocomplete="off" maxlength="15" />
            <span class="nickname-status" id="nicknameStatus"></span>
          </div>
          <div class="nickname-hint" id="nicknameHint">От 5 до 15 символов: латиница в нижнем регистре, цифры, _</div>
</div>
        <div class="form-group" id="identifierGroup">
          <label for="authEmail" id="authEmailLabel">Email</label>
          <input type="text" id="authEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group" id="passwordGroup">
          <label for="authPassword">Пароль</label>
          <div class="password-input-wrapper">
            <input type="password" id="authPassword" placeholder="Минимум 6 символов" required autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" id="passwordToggleBtn" aria-label="Показать пароль">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <div class="auth-forgot-row" id="authForgotRow">
            <a href="#" id="forgotPasswordLink" class="auth-forgot-link">Забыли пароль?</a>
          </div>
        </div>
        <div class="form-group" id="recoveryPasswordGroup" style="display:none;">
          <label for="recoveryPassword">Новый пароль</label>
          <div class="password-input-wrapper">
            <input type="password" id="recoveryPassword" placeholder="Минимум 6 символов" autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" id="recoveryPasswordToggleBtn" aria-label="Показать пароль">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <div class="auth-error" id="authError"></div>
        <button type="submit" class="btn btn-primary auth-submit" id="authSubmitBtn">Войти</button>
      </form>
    </div>
  </div>

  <script src="../script.js"></script>
</body>
</html>
