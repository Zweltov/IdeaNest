  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>(function(){try{
  var modePref=localStorage.getItem('ideanest-theme');
  var t=null;
  try{t=JSON.parse(localStorage.getItem('ideanest_theme')||'null');}catch(e){}
  var GREEN={
    'accent-primary':'#1a9f4b','accent-hover':'#15803d','accent-light':'#e8f8ef',
    'bg-color':'#f3f6f5','bg-muted':'#e8eeeb','surface-color':'#ffffff',
    'text-main':'#0c1411','text-muted':'#5a6f66','border-color':'#d5e0db'
  };
  var DARK={
    'accent-primary':'#1a9f4b','accent-hover':'#22c55e','accent-light':'#143528',
    'bg-color':'#0c1411','bg-muted':'#101a16','surface-color':'#15201b',
    'text-main':'#e8f0ec','text-muted':'#8aa399','border-color':'rgba(255,255,255,0.1)'
  };
  // resolve mode: explicit toggle wins
  var mode=modePref;
  if(mode!=='light'&&mode!=='dark'){
    if(t&&(t.key==='dark'||t.key==='neon')) mode='dark';
    else mode='light';
  }
  try{localStorage.setItem('ideanest-theme',mode);}catch(e){}
  if(mode==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');

  // base palette for mode (never apply dark bg colors in light mode)
  var base=mode==='dark'?DARK:GREEN;
  var colors=Object.assign({},base);
  if(t&&t.colors){
    // only keep custom accent if not legacy orange
    var ap=(t.colors['accent-primary']||'').toLowerCase();
    var isOrange=!ap||/#f59e0b|#d97706|#fffbeb|#ea580c|#f97316|#fb923c|#ca8a04|#eab308|#fbbf24/.test(ap)||ap.indexOf('f59')>=0;
    if(!isOrange&&ap){
      colors['accent-primary']=t.colors['accent-primary'];
      colors['accent-hover']=t.colors['accent-hover']||colors['accent-hover'];
      colors['accent-light']=t.colors['accent-light']||colors['accent-light'];
    }
  }
  var r=document.documentElement.style;
  Object.keys(colors).forEach(function(k){r.setProperty('--'+k,colors[k]);});
  r.setProperty('--accent',colors['accent-primary']);
  r.setProperty('--accent-primary',colors['accent-primary']);
  r.setProperty('--accent-hover',colors['accent-hover']);
  r.setProperty('--accent-light',colors['accent-light']);
  // persist cleaned theme
  try{
    localStorage.setItem('ideanest_theme',JSON.stringify({key:mode,colors:colors}));
  }catch(e){}
}catch(e){}})();</script>
</head>
<body>

  <!--
    Общий шаблон для ВСЕХ статей (не отдельный файл на каждую): сама статья
    хранится в таблице articles в Supabase, а нужный id передаётся через
    ссылку, например articles/article.html?id=3. Подключены те же
    style.css и script.js, что и на главной странице и у страниц идей.
  -->

  <div class="profile-blur-overlay" id="profileBlurOverlay"></div>

  <!-- shell-chrome injects nav -->

  <main class="detail-main detail-main--article">
    <a href="../index.html#articles" class="btn-text" style="margin-bottom: 24px; display: inline-flex;">
      Ко всем статьям
    </a>

    <div class="article-page-body" style="cursor: default;" id="articleDetailContainer">
      <p style="color: var(--text-muted);">Загрузка статьи...</p>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <div class="modal-backdrop" id="authBackdrop">
    <div class="modal auth-modal">
      <button class="modal-close" id="authCloseBtn" aria-label="Закрыть"><i data-lucide="x"></i></button>
      <div class="auth-tabs" id="authTabs">
        <button class="auth-tab active" data-auth-tab="signin">Вход</button>
        <button class="auth-tab" data-auth-tab="signup">Регистрация</button>
      </div>
      <button type="button" class="auth-reset-back" id="authResetBack" style="display:none;">
        Назад ко входу
      </button>
      <form id="authForm">
        <div class="form-group nickname-group" id="usernameGroup">
          <label for="authFullName">Имя</label>
          <input type="text" id="authFullName" placeholder="Александр" autocomplete="name" style="margin-bottom:14px;" />

          <label for="authUsername">Никнейм</label>
          <div class="nickname-input-wrapper">
            <span class="nickname-at">@</span>
            <input type="text" id="authUsername" placeholder="nickname" autocomplete="off" maxlength="15" />
            <span class="nickname-status" id="nicknameStatus"></span>
          </div>
          <div class="nickname-hint" id="nicknameHint">От 5 до 15 символов: латиница в нижнем регистре, цифры, _</div>
</div>
        <div class="form-group" id="identifierGroup">
          <label for="authEmail" id="authEmailLabel">Email</label>
          <input type="text" id="authEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group" id="passwordGroup">
          <label for="authPassword">Пароль</label>
          <div class="password-input-wrapper">
            <input type="password" id="authPassword" placeholder="Минимум 6 символов" required autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" id="passwordToggleBtn" aria-label="Показать пароль">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <div class="auth-forgot-row" id="authForgotRow">
            <a href="#" id="forgotPasswordLink" class="auth-forgot-link">Забыли пароль?</a>
          </div>
        </div>
        <div class="form-group" id="recoveryPasswordGroup" style="display:none;">
          <label for="recoveryPassword">Новый пароль</label>
          <div class="password-input-wrapper">
            <input type="password" id="recoveryPassword" placeholder="Минимум 6 символов" autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" id="recoveryPasswordToggleBtn" aria-label="Показать пароль">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <div class="auth-error" id="authError"></div>
        <button type="submit" class="btn btn-primary auth-submit" id="authSubmitBtn">Войти</button>
      </form>
    </div>
  </div>

  <script src="../script.js"></script>
  <script src="../shell-chrome.js"></script>
</body>
</html>
